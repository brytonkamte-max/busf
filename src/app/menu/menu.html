<nav class="menu">

  <a routerLink="/" class="menu-logo">
    <img src="logo.png" width="32" height="32" alt="logo" />
    <span class="logo-text">Brianza<strong>Bus</strong></span>
  </a>

  <ul class="menu-list">
    @for (item of menuItems; track item.label) {

      @if (!item.adminOnly || authService.isAdmin()) {
        <li>
          <a class="menu-item"
             [routerLink]="item.route"
             routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: item.exact || false }">
            <span>{{ item.icon }}</span>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }

    }
  </ul>

</nav>
