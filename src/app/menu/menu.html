<nav class="menu">
  
  <div class="menu-logo">
    <img src="logo.png" width="32" height="32" alt="logo" />
  </div>

  <ul class="menu-list">
    @for (item of menuItems; track item.label) {
      <li>
        <a class="menu-item" [routerLink]="item.route" routerLinkActive="active">
          <span>{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>

</nav>
