<div class="page">

  <div class="controls-wrapper">
    <div class="control-row">
      <input [(ngModel)]="newLineName" type="text" placeholder="Nuova linea (es: z228, 423...)" />
      <button class="btn-main" (click)="addLine()" [disabled]="!newLineName.trim()">Aggiungi</button>
    </div>

    <div class="control-row">
      <input [(ngModel)]="search" type="text" placeholder="Cerca linea o indirizzo..." />
      <button class="btn-main" (click)="searchLines()">Cerca</button>
    </div>
  </div>

  <div class="lines-container">
    @for (line of lines(); track line.id) {
      <div class="line-card" (click)="openLine(line)">
        <div class="line-header">
          <span class="line-dot"></span>
          <span>LINEA {{ line.name }}</span>
        </div>

        <div class="line-content">
          <div class="line-preview">
            <span>{{ line.stops?.length ?? 0 }} fermate</span>
          </div>

          <button class="btn-delete-line" (click)="deleteLine(line.id); $event.stopPropagation()">
            <i class="fas fa-trash"></i> Elimina
          </button>
        </div>
      </div>
    } @empty {
      <div class="empty">
        Non ci sono linee da visualizzare.
      </div>
    }
  </div>

</div>
