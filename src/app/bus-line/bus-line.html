<div class="page">

  <div class="top-bar">
    <input [(ngModel)]="newLineName" type="text" placeholder="Esempio: z228, 423..." />
    <button (click)="addLine()" [disabled]="!newLineName.trim()">Aggiungi</button>
  </div>

  <div class="search-bar">
    <input
      [(ngModel)]="search"
      type="text"
      placeholder="Cerca linea o indirizzo..."
    />
    <button (click)="searchLines()">Cerca</button>
  </div>

  <div class="lines-container">
    @for (line of lines(); track line.id) {
      <div class="line-card" (click)="openLine(line)">
        <div class="line-header">
          <span class="line-dot"></span>
          <span>LINE {{ line.name }}</span>
        </div>

        <div class="line-preview">
          <span>{{ line.stops?.length ?? 0 }} stops</span>
        </div>

        <button class="btn-delete-line" (click)="deleteLine(line.id); $event.stopPropagation()">
          <i class="fas fa-trash"></i> Elimina
        </button>
      </div>
    } @empty {
      <div class="empty">
        Non ci sono linee da visualizzare.
      </div>
    }
  </div>

</div>
